<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Git branch/commit structure -->
  <circle cx="8" cy="4" r="2" fill="url(#grad1)" stroke="#c0392b" stroke-width="0.5"/>
  <line x1="8" y1="6" x2="8" y2="10" stroke="#34495e" stroke-width="1.5"/>
  <line x1="8" y1="8" x2="5" y2="8" stroke="#34495e" stroke-width="1.5"/>
  <line x1="8" y1="10" x2="11" y2="10" stroke="#34495e" stroke-width="1.5"/>

  <!-- Commit circles -->
  <circle cx="5" cy="8" r="1.5" fill="#27ae60" stroke="#229954" stroke-width="0.5"/>
  <circle cx="11" cy="10" r="1.5" fill="#3498db" stroke="#2980b9" stroke-width="0.5"/>
  <circle cx="8" cy="12" r="1.5" fill="#9b59b6" stroke="#8e44ad" stroke-width="0.5"/>
</svg>
